<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
 <title id="title">FPGA-Assisted License Plate Recognition with Deep Learning</title>

 <desc id="desc">Current PYNQ-Z2 and laptop architecture. The PS main loop captures USB video, retains the original color frame, sends grayscale input to the PL through axi_dma_0 MM2S, and receives ROI metadata and binary edges through two S2MM channels. The PL uses Sobel, an AXI-Stream broadcaster, grid counting, active-grid selection and four-connected ROI analysis. MM2S and ROI S2MM belong to axi_dma_0; the edge S2MM belongs to axi_dma_edge. A PC PyQt5 client receives JPEG, PNG, ROI coordinates and DMA window time over TCP 8080. TCP 8081 carries commands towards the board and fields, metrics and AI status towards the client. Captured original-color ROI crops are uploaded asynchronously to PC Flask port 5000. HyperLPR3 runs on the PC using ONNX Runtime. JSON recognition results return to the board and then reach PyQt5 through TCP 8081. No Jupyter display or CNN inference is executed on the FPGA.</desc>
