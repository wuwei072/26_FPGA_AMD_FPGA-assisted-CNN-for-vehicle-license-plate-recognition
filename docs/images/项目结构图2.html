<svg width="2000" height="1440" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
 <title id="title">FPGA-Assisted License Plate Recognition with Deep Learning</title>
 <desc id="desc">Module-name-only view of the verified project. Upper Zynq PS+PL and lower PC. Two interconnects remain distinct. The 3xAXI teal bus is a bundle of three separate DMA memory master interfaces, arbitrated by axi_interconnect_mem, connected to PS HP0 and DDR controller. axi_dma_0 contains MM2S and S2MM; axi_dma_edge has only S2MM. Sobel, AXIS broadcast, grid_counter and roi_engine are retained. Active-grid selection and four-connected analysis are inside roi_engine. Frame Capture feeds Color ROI Crop directly through the solid Color Frame bypass. DMA Runtime supplies ROI coordinates, not the image to be cropped; grayscale is used only for the hardware input path. PS retains manual/auto capture and asynchronous recognition client. PC retains Qt, Flask, HyperLPR3 and ONNX Runtime. Recognition returns to PS before updating Qt; model does not directly drive Qt. Solid lines carry data or link relationships; purple dashed lines show DMA register configuration through the control interconnect. All removed micro-operation captions remain implemented in RTL.</desc>
